aid: setlist-fm
name: setlist.fm
description: setlist.fm is a concert setlist database providing a REST API for accessing setlists, searching
  by artist or venue, tracking tour dates, and accessing live music performance data. The API supports
  JSON and XML responses, uses MusicBrainz IDs for artist identification, and provides endpoints for artists,
  venues, cities, countries, and user attendance data.
