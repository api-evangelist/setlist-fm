openapi: 3.2.0
info:
  description: 'The setlist.fm API has been designed to give you easy access to setlist data in order to build fancy websites and

    other applications.'
  version: '1.0'
  title: setlist.fm /1.0/search/countries API
servers:
- url: /rest
tags:
- name: /1.0/search/countries
paths:
  /1.0/search/countries:
    get:
      tags:
      - /1.0/search/countries
      summary: Get a complete list of all supported countries
      description: Get a complete list of all supported countries.
      operationId: resource__1.0_search_countries_getCountries_GET
      responses:
        '200':
          headers: {}
          description: Success
          content:
            application/xml:
              schema:
                description: ''
                $ref: '#/components/schemas/json_Countries'
            application/json:
              schema:
                description: ''
                $ref: '#/components/schemas/json_Countries'
              example:
                country:
                - code: US
                  name: United States
                - code: '...'
                  name: '...'
                total: 42
                page: 1
                itemsPerPage: 20
components:
  schemas:
    json_Country:
      type: object
      title: country
      properties:
        code:
          example: US
          description: 'The country''s <a href= "http://www.iso.org/iso/english_country_names_and_code_elements" >ISO code</a>. E.g.

            <em>&quot;ie&quot;</em> for Ireland'
          type: string
        name:
          example: United States
          description: 'The country''s name. Can be a localized name - e.g. <em>&quot;Austria&quot;</em> or

            <em>&quot;&Ouml;sterreich&quot;</em> for Austria if the German name was requested.'
          type: string
      example:
        code: US
        name: United States
      description: This class represents a country on earth.
    json_Countries:
      type: object
      title: countries
      properties:
        country:
          description: result list of countries
          type: array
          items:
            $ref: '#/components/schemas/json_Country'
        total:
          example: 42
          description: the total amount of items matching the query
          type: number
        page:
          example: 1
          description: the current page. starts at 1
          type: number
        itemsPerPage:
          example: 20
          description: the amount of items you get per page
          type: number
      example:
        country:
        - code: US
          name: United States
        - code: '...'
          name: '...'
        total: 42
        page: 1
        itemsPerPage: 20
      description: A Result consisting of a list of countries.
